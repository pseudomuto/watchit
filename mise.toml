[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[deps.cargo]
auto = true
sources = [
  "Cargo.toml",
  "crates/client/Cargo.toml",
  "crates/server/Cargo.toml",
  "crates/shared/Cargo.toml",
]
outputs = ["Cargo.lock"]
run = "cargo fetch"

[tools]
"cargo:cargo-shear" = "latest"
protoc = "latest"

[tasks.build]
description = "Build the project in debug mode"
run = "cargo build"

[tasks."build:release"]
description = "Build the project in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run the tests"
run = "cargo test --all-features"

[tasks."test:ci"]
description = "Run the full CI pipeline"
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "lint:deps" },
  { task = "test" },
  { task = "build" },
]

[tasks."test:verbose"]
description = "Run the tests without capturing output"
run = "cargo test --all-features -- --no-capture"

[tasks.fmt]
description = "Run cargo fmt"
run = "cargo +nightly fmt --all"

[tasks."fmt:check"]
description = "Check if cargo fmt would change anything"
run = "cargo +nightly fmt --all -- --check"

[tasks.lint]
description = "Run clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:deps"]
description = "Check for unused dependencies"
run = "cargo shear"

[tasks."lint:fix"]
description = "Run clippy and auto-fix where possible"
run = "cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged"

[tasks.server]
description = "Run the server locally on 127.0.0.1 using dev certs (needs WATCHIT_JACKETT_API_KEY and WATCHIT_DELUGE_PASSWORD)"
depends = ["certs:dev"]
run = "cargo run --bin server -- --host 127.0.0.1 --certs-dir hack/certs --jackett-url ${JACKETT_URL:-http://localhost:9117} --deluge-url ${DELUGE_URL:-http://localhost:8112}"

[tasks.client]
description = "Run the client against the local server using dev certs"
raw = true
depends = ["certs:dev"]
run = "cargo run --bin client -- --certs-dir hack/certs"

[tasks."certs:dev"]
description = "Generate dev certs in hack/certs (skips any that already exist)"
hide = true
run = """
set -eu
dir=hack/certs
[ -f "$dir/ca.pem" ] || cargo run -q --bin certs -- --dir "$dir" ca
[ -f "$dir/server.pem" ] || cargo run -q --bin certs -- --dir "$dir" server --san localhost --san 127.0.0.1
[ -f "$dir/client.pem" ] || cargo run -q --bin certs -- --dir "$dir" client --name dev
"""
