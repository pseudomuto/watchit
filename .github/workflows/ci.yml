name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before dev, so `dev up` fetches crates into a warm cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Installs everything in dev.yaml: Rust (plus nightly rustfmt), protoc,
      # cargo-shear, actionlint and shellcheck.
      - uses: pseudomuto/dev@ecf701458d22c8cc98192fc17693aff18ae1ef4f # v0.6.0

      - name: Run CI checks
        run: dev test:ci
